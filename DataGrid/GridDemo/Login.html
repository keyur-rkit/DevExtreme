<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>

    <!-- Jquery -->
    <script
      type="text/javascript"
      src="../Scripts/jquery-3.5.1.min.js"
    ></script>

    <!-- DevExtreme theme -->
    <link rel="stylesheet" href="../Content/dx.dark.css" />

    <!-- DevExtreme library -->
    <script type="text/javascript" src="../Scripts/dx.all.js"></script>

    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
    </style>
  </head>

  <body class="dx-viewport container">
    <form id="form" action="">
      <div class="dx-fieldset">
        <div class="dx-fieldset-header">Login Here</div>
        <div class="dx-field">
          <div class="dx-field-label">Username</div>
          <div class="dx-field-value">
            <div id="username"></div>
          </div>
        </div>
        <div class="dx-field">
          <div class="dx-field-label">Password</div>
          <div class="dx-field-value">
            <div id="password"></div>
          </div>
        </div>
      </div>
      <div class="dx-fieldset">
        <div class="dx-field">
          <div class="dx-field-value">
            <div id="login"></div>
          </div>
        </div>
      </div>
    </form>

    <script>
      $(document).ready(() => {
        $("#username")
          .dxTextBox({})
          .dxValidator({
            validationRules: [
              {
                type: "required",
                message: "Username is required",
              },
            ],
          });

        $("#password")
          .dxTextBox({
            // mode: "password",
          })
          .dxValidator({
            validationRules: [
              {
                type: "required",
                message: "Password is required",
              },
            ],
          });

        $("#login").dxButton({
          text: "Login",
          type: "success",
          useSubmitBehavior: true,
        });

        $("#form").on("submit", (e) => {
          e.preventDefault();

          var usernameInput = $("#username")
            .dxTextBox("instance")
            .option("value");
          var passwordInput = $("#password")
            .dxTextBox("instance")
            .option("value");

          //   console.log(usernameInput, passwordInput);

          $.ajax({
            url: "https://dummyjson.com/auth/login",
            type: "POST",
            contentType: "application/json", // Set the content type to JSON
            data: JSON.stringify({
              username: usernameInput,
              password: passwordInput,
            }),
            success: (res) => {
              //   console.log(res);
              sessionStorage.setItem("userToken", res.accessToken);

              DevExpress.ui.notify(
                {
                  message: "Login successful",
                  position: "top center",
                  width: 200,
                },
                "success",
                2000
              );

              window.location.href = "./Home.html";
            },
            error: (e) => {
              console.log(`Error : ${e.responseJSON.message}`);

              DevExpress.ui.notify(
                {
                  message: e.responseJSON.message,
                  position: "top center",
                  width: 200,
                },
                "error",
                2000
              );
            },
          });
        });
      });
    </script>
  </body>
</html>
