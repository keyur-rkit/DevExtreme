<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DataGrid</title>
  <!-- Jquery -->
  <!-- <script type="text/javascript" src="./Scripts/jquery-3.5.1.min.js"></script> -->
  <!-- DevExtreme theme -->
  <!-- <link rel="stylesheet" href="./Content/dx.dark.css"> -->
  <!-- DevExtreme library -->
  <!-- <script type="text/javascript" src="./Scripts/dx.all.js"></script> -->
  <!-- Jquery -->
  <script type="text/javascript" src="/DataGrid/Scripts/jquery-3.5.1.min.js"></script>

  <!-- DevExtreme theme -->
  <link rel="stylesheet" href="/DataGrid/Content/dx.dark.css" />

  <!-- DevExtreme library -->
  <script type="text/javascript" src="/DataGrid/Scripts/dx.all.js"></script>

  <style>
    /* Centering content*/
    body {
      font-family: Arial, sans-serif;
      background-color: #2a2a2a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      text-align: center;
      background-color: #fff;
      padding: 20px;
      border-radius: 8px;
    }

    .innerContainer {
      width: 600px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
    }

    .innerContainer>div {
      margin: 5px;
      font-size: larger;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>DataGrid</h1>

    <div class="innerContainer">
      <div id="dataBindingLink"></div>
      <div id="recordPagingLink"></div>
      <div id="virtualInfiniteScrollingLink"></div>
      <div id="editingLink"></div>
    </div>
  </div>

  <script>
    $(function () {
      $("#dataBindingLink").dxButton({
        text: "DataBinding",
        onClick: function () {
          window.location.href = "./DataBinding/DataBinding.html";
        },
      });

      $("#recordPagingLink").dxButton({
        text: "RecordPaging",
        onClick: function () {
          window.location.href = "./PagingAndScrolling/RecordPaging.html";
        },
      });

      $("#virtualInfiniteScrollingLink").dxButton({
        text: "VirtualInfiniteScrolling",
        onClick: function () {
          window.location.href = "./PagingAndScrolling/VirtualInfiniteScrolling.html";
        },
      });

      $("#editingLink").dxButton({
        text: "Editing",
        onClick: function () {
          window.location.href = "./Editing/Editing.html";
        },
      });

    });
  </script>
</body>

</html>
