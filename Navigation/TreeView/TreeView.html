<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TreeViewDemo</title>

    <!-- Jquery -->
    <script
      type="text/javascript"
      src="../Scripts/jquery-3.5.1.min.js"
    ></script>

    <!-- DevExtreme theme -->
    <link rel="stylesheet" href="../Content/dx.dark.css" />

    <!-- DevExtreme library -->
    <script type="text/javascript" src="../Scripts/dx.all.js"></script>

    <style>
      .colorClass {
        background-color: black;
      }
      .outer {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .container {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        width: 300px;
        height: 300px;
        margin: 0 auto;
        border: 1px solid #ccc;
        padding: 20px;
        border-radius: 8px;
      }

      #animeImg {
        max-width: 100%;
        max-height: 80%;
      }
    </style>
  </head>

  <body class="dx-viewport">
    <h1>TreeView Demo</h1>
    <div class="outer">
      <div id="animeTreeView"></div>
      <div id="dataContainer">
        <div id="desc"></div>
        <img id="animeImg" src="" alt="" />
      </div>
    </div>
    <div id="selected">Selected Items:</div>

    <script src="data.js"></script>
    <script src="TreeView.js"></script>
  </body>
</html>
